  <rect x="34" y="34" width="532" height="532" rx="48" fill="#0F1820"/>
  <!-- globe -->
  <g fill="none" stroke="#0AC18E" stroke-width="9" stroke-linecap="round">
    <circle cx="300" cy="212" r="96"/>
    <ellipse cx="300" cy="212" rx="42" ry="96"/>
    <line x1="204" y1="212" x2="396" y2="212"/>
