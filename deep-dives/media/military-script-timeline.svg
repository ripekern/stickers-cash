<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" style="max-width:100%;height:auto;font-family:system-ui,-apple-system,sans-serif;">
  <!-- Background -->
  <rect width="1000" height="300" fill="#0a0a0a"/>
  
  <!-- Title -->
  <text x="500" y="40" text-anchor="middle" font-size="32" font-weight="700" fill="#ffffff">Military Script Through History</text>
  
  <!-- Timeline base -->
  <line x1="100" y1="150" x2="900" y2="150" stroke="#333333" stroke-width="3"/>
  
  <!-- Timeline events -->
  
  <!-- 1930s-1945: Japanese Invasion Money -->
  <circle cx="180" cy="150" r="10" fill="#f59e0b"/>
  <text x="180" y="120" text-anchor="middle" font-size="18" font-weight="700" fill="#f59e0b">1930s-1945</text>
  <text x="180" y="185" text-anchor="middle" font-size="16" fill="#ffffff">Japanese Invasion</text>
  <text x="180" y="205" text-anchor="middle" font-size="16" fill="#ffffff">Money</text>
  <text x="180" y="235" text-anchor="middle" font-size="13" fill="#888888">Philippines, Malaya,</text>
  <text x="180" y="253" text-anchor="middle" font-size="13" fill="#888888">Burma, Indonesia</text>
  
  <!-- 1940s: British Military Authority -->
  <circle cx="340" cy="150" r="10" fill="#3b82f6"/>
  <text x="340" y="120" text-anchor="middle" font-size="18" font-weight="700" fill="#3b82f6">1940s</text>
  <text x="340" y="185" text-anchor="middle" font-size="16" fill="#ffffff">British Military</text>
  <text x="340" y="205" text-anchor="middle" font-size="16" fill="#ffffff">Authority Notes</text>
  <text x="340" y="235" text-anchor="middle" font-size="13" fill="#888888">Occupied Italy</text>
  <text x="340" y="253" text-anchor="middle" font-size="13" fill="#888888">and territories</text>
  
  <!-- 1944-1948: Allied Military Marks -->
  <circle cx="500" cy="150" r="10" fill="#10b981"/>
  <text x="500" y="120" text-anchor="middle" font-size="18" font-weight="700" fill="#10b981">1944-1948</text>
  <text x="500" y="185" text-anchor="middle" font-size="16" fill="#ffffff">Allied Military</text>
  <text x="500" y="205" text-anchor="middle" font-size="16" fill="#ffffff">Marks</text>
  <text x="500" y="235" text-anchor="middle" font-size="13" fill="#888888">Occupied Germany</text>
  <text x="500" y="253" text-anchor="middle" font-size="13" fill="#888888">post-WWII</text>
  
  <!-- 1940s: Soviet Occupation Marks -->
  <circle cx="660" cy="150" r="10" fill="#ef4444"/>
  <text x="660" y="120" text-anchor="middle" font-size="18" font-weight="700" fill="#ef4444">1940s</text>
  <text x="660" y="185" text-anchor="middle" font-size="16" fill="#ffffff">Soviet Occupation</text>
  <text x="660" y="205" text-anchor="middle" font-size="16" fill="#ffffff">Marks</text>
  <text x="660" y="235" text-anchor="middle" font-size="13" fill="#888888">Eastern Europe</text>
  <text x="660" y="253" text-anchor="middle" font-size="13" fill="#888888">and East Germany</text>
  
  <!-- 1940s-1970s: US Military Payment Certificates -->
  <circle cx="820" cy="150" r="10" fill="#8b5cf6"/>
  <text x="820" y="120" text-anchor="middle" font-size="18" font-weight="700" fill="#8b5cf6">1940s-1970s</text>
  <text x="820" y="185" text-anchor="middle" font-size="16" fill="#ffffff">U.S. Military Payment</text>
  <text x="820" y="205" text-anchor="middle" font-size="16" fill="#ffffff">Certificates</text>
  <text x="820" y="235" text-anchor="middle" font-size="13" fill="#888888">Germany, Vietnam,</text>
  <text x="820" y="253" text-anchor="middle" font-size="13" fill="#888888">overseas bases</text>
</svg>
