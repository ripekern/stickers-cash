<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" style="max-width:100%;height:auto;font-family:system-ui,-apple-system,sans-serif;">
  <!-- Background -->
  <rect width="1000" height="450" fill="#0a0a0a"/>
  
  <!-- Title -->
  <text x="500" y="45" text-anchor="middle" font-size="36" font-weight="700" fill="#ffffff">The Closed Loop</text>
  <text x="500" y="75" text-anchor="middle" font-size="20" fill="#888888">Military Script vs Federal Reserve Notes</text>
  
  <!-- Left side: Military Script -->
  <rect x="80" y="110" width="380" height="280" fill="#1a1a1a" stroke="#ef4444" stroke-width="3" rx="8"/>
  <text x="270" y="145" text-anchor="middle" font-size="26" font-weight="700" fill="#ef4444">Military Script</text>
  
  <!-- Authority -->
  <rect x="120" y="170" width="300" height="50" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444" stroke-width="2" rx="6"/>
  <text x="270" y="200" text-anchor="middle" font-size="20" font-weight="600" fill="#ffffff">Military Authority</text>
  
  <!-- Arrow down -->
  <path d="M 270 220 L 270 240 M 260 230 L 270 240 L 280 230" stroke="#ef4444" stroke-width="3" fill="none"/>
  
  <!-- Issues Currency -->
  <rect x="120" y="245" width="300" height="50" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-width="2" rx="6"/>
  <text x="270" y="275" text-anchor="middle" font-size="20" font-weight="600" fill="#ffffff">Issues Currency</text>
  
  <!-- Arrow down -->
  <path d="M 270 295 L 270 315 M 260 305 L 270 315 L 280 305" stroke="#ef4444" stroke-width="3" fill="none"/>
  
  <!-- Civilians -->
  <rect x="120" y="320" width="300" height="50" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-width="2" rx="6"/>
  <text x="270" y="350" text-anchor="middle" font-size="20" font-weight="600" fill="#ffffff">Civilians Compelled</text>
  
  <!-- Arrow looping back up -->
  <path d="M 460 345 Q 490 345 490 250 Q 490 145 270 145 Q 50 145 50 250 Q 50 345 80 345" 
        stroke="#ef4444" stroke-width="3" fill="none" stroke-dasharray="8,4" opacity="0.7"/>
  <text x="270" y="425" text-anchor="middle" font-size="18" fill="#ef4444" font-weight="700">Trapped Inside</text>
  
  <!-- Right side: Federal Reserve Notes -->
  <rect x="540" y="110" width="380" height="280" fill="#1a1a1a" stroke="#f59e0b" stroke-width="3" rx="8"/>
  <text x="730" y="145" text-anchor="middle" font-size="26" font-weight="700" fill="#f59e0b">Federal Reserve Notes</text>
  
  <!-- Federal Reserve -->
  <rect x="580" y="170" width="300" height="50" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="2" rx="6"/>
  <text x="730" y="200" text-anchor="middle" font-size="20" font-weight="600" fill="#ffffff">Federal Reserve</text>
  
  <!-- Arrow down -->
  <path d="M 730 220 L 730 240 M 720 230 L 730 240 L 740 230" stroke="#f59e0b" stroke-width="3" fill="none"/>
  
  <!-- Issues Currency -->
  <rect x="580" y="245" width="300" height="50" fill="#f59e0b" fill-opacity="0.1" stroke="#f59e0b" stroke-width="2" rx="6"/>
  <text x="730" y="275" text-anchor="middle" font-size="20" font-weight="600" fill="#ffffff">Issues Currency</text>
  
  <!-- Arrow down -->
  <path d="M 730 295 L 730 315 M 720 305 L 730 315 L 740 305" stroke="#f59e0b" stroke-width="3" fill="none"/>
  
  <!-- Civilians -->
  <rect x="580" y="320" width="300" height="50" fill="#f59e0b" fill-opacity="0.1" stroke="#f59e0b" stroke-width="2" rx="6"/>
  <text x="730" y="350" text-anchor="middle" font-size="20" font-weight="600" fill="#ffffff">Civilians Compelled</text>
  
  <!-- Arrow looping back up -->
  <path d="M 920 345 Q 950 345 950 250 Q 950 145 730 145 Q 510 145 510 250 Q 510 345 540 345" 
        stroke="#f59e0b" stroke-width="3" fill="none" stroke-dasharray="8,4" opacity="0.7"/>
  <text x="730" y="425" text-anchor="middle" font-size="18" fill="#f59e0b" font-weight="700">Trapped Inside</text>
</svg>
