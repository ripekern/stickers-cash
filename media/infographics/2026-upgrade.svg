<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <style>
      .bg { fill: #0F1820; }
      .text { fill: #ffffff; font-family: 'Ubuntu', sans-serif; }
      .text-small { fill: #ffffff; font-family: 'Ubuntu', sans-serif; font-size: 11px; }
      .text-tiny { fill: #ffffff; font-family: 'Ubuntu', sans-serif; font-size: 10px; }
      .text-label { fill: #0AC18E; font-family: 'Ubuntu', sans-serif; font-size: 14px; font-weight: 500; }
      .before-box { fill: #2a1a1a; stroke: #ff6b6b; stroke-width: 2; }
      .after-box { fill: #1a232b; stroke: #0AC18E; stroke-width: 2; }
      .arrow { fill: #0AC18E; stroke: none; }
      .check { fill: #0AC18E; }
      .x { fill: #ff6b6b; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" class="arrow"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" class="bg"/>
  
  <!-- Title -->
  <text x="400" y="30" class="text" style="font-size: 22px; font-weight: 700;" text-anchor="middle">BCH 2026 Upgrade: Before → After</text>
  
  <!-- Before column -->
  <text x="200" y="60" class="text" style="font-size: 16px; font-weight: 700; fill: #ff6b6b;" text-anchor="middle">Before 2026</text>
  
  <!-- Before features -->
  <rect x="50" y="80" width="300" height="60" class="before-box" rx="6"/>
  <text x="70" y="105" class="text-small">Script size limit</text>
  <text x="70" y="125" class="text-tiny">Max 1,650 bytes for unlocking scripts</text>
  <circle cx="330" cy="110" r="10" class="x"/>
  <text x="330" y="116" class="text" style="font-size: 12px; font-weight: 700;" text-anchor="middle">✗</text>
  
  <rect x="50" y="150" width="300" height="60" class="before-box" rx="6"/>
  <text x="70" y="175" class="text-small">No loops</text>
  <text x="70" y="195" class="text-tiny">Cannot iterate over outputs or inputs</text>
  <circle cx="330" cy="180" r="10" class="x"/>
  <text x="330" y="186" class="text" style="font-size: 12px; font-weight: 700;" text-anchor="middle">✗</text>
  
  <rect x="50" y="220" width="300" height="60" class="before-box" rx="6"/>
  <text x="70" y="245" class="text-small">No reusable functions</text>
  <text x="70" y="265" class="text-tiny">Must duplicate logic in every contract</text>
  <circle cx="330" cy="250" r="10" class="x"/>
  <text x="330" y="256" class="text" style="font-size: 12px; font-weight: 700;" text-anchor="middle">✗</text>
  
  <rect x="50" y="290" width="300" height="60" class="before-box" rx="6"/>
  <text x="70" y="315" class="text-small">NFT commitment limit</text>
  <text x="70" y="335" class="text-tiny">Max 40 bytes for token metadata</text>
  <circle cx="330" cy="320" r="10" class="x"/>
  <text x="330" y="326" class="text" style="font-size: 12px; font-weight: 700;" text-anchor="middle">✗</text>
  
  <!-- After column -->
  <text x="600" y="60" class="text" style="font-size: 16px; font-weight: 700; fill: #0AC18E;" text-anchor="middle">After 2026</text>
  
  <!-- After features -->
  <rect x="450" y="80" width="300" height="60" class="after-box" rx="6"/>
  <text x="470" y="105" class="text-small">P2S: Larger scripts</text>
  <text x="470" y="125" class="text-tiny">Up to 10,000 bytes for complex contracts</text>
  <circle cx="730" cy="110" r="10" class="check"/>
  <text x="730" y="116" class="text" style="font-size: 12px; font-weight: 700;" text-anchor="middle">✓</text>
  
  <rect x="450" y="150" width="300" height="60" class="after-box" rx="6"/>
  <text x="470" y="175" class="text-small">OP_BEGIN / OP_UNTIL</text>
  <text x="470" y="195" class="text-tiny">Bounded loops for iteration</text>
  <circle cx="730" cy="180" r="10" class="check"/>
  <text x="730" y="186" class="text" style="font-size: 12px; font-weight: 700;" text-anchor="middle">✓</text>
  
  <rect x="450" y="220" width="300" height="60" class="after-box" rx="6"/>
  <text x="470" y="245" class="text-small">OP_DEFINE / OP_INVOKE</text>
  <text x="470" y="265" class="text-tiny">Reusable functions reduce duplication</text>
  <circle cx="730" cy="250" r="10" class="check"/>
  <text x="730" y="256" class="text" style="font-size: 12px; font-weight: 700;" text-anchor="middle">✓</text>
  
  <rect x="450" y="290" width="300" height="60" class="after-box" rx="6"/>
  <text x="470" y="315" class="text-small">Larger NFT commitments</text>
  <text x="470" y="335" class="text-tiny">Up to 128 bytes for rich metadata</text>
  <circle cx="730" cy="320" r="10" class="check"/>
  <text x="730" y="326" class="text" style="font-size: 12px; font-weight: 700;" text-anchor="middle">✓</text>
  
  <!-- Arrow showing upgrade -->
  <line x1="360" y1="200" x2="440" y2="200" class="line" stroke="#0AC18E" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- Impact section -->
  <rect x="50" y="380" width="700" height="100" fill="#1a232b" stroke="#0AC18E" stroke-width="2" rx="8"/>
  <text x="400" y="405" class="text" style="font-size: 16px; font-weight: 700;" text-anchor="middle">What This Enables</text>
  
  <text x="150" y="430" class="text-small" text-anchor="middle">Complex DAOs</text>
  <text x="150" y="445" class="text-tiny" text-anchor="middle">Iterate over many voters</text>
  
  <text x="300" y="430" class="text-small" text-anchor="middle">Token Protocols</text>
  <text x="300" y="445" class="text-tiny" text-anchor="middle">Check all outputs efficiently</text>
  
  <text x="450" y="430" class="text-small" text-anchor="middle">Smaller Contracts</text>
  <text x="450" y="445" class="text-tiny" text-anchor="middle">Reuse code, save bytes</text>
  
  <text x="600" y="430" class="text-small" text-anchor="middle">Rich NFTs</text>
  <text x="600" y="445" class="text-tiny" text-anchor="middle">Store more metadata</text>
  
  <text x="400" y="470" class="text-small" text-anchor="middle" style="fill: #0AC18E;">✓ More powerful contracts while staying cheap to validate</text>
</svg>
