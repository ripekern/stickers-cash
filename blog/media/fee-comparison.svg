<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350" style="max-width:100%;height:auto;font-family:system-ui,-apple-system,sans-serif;">
  <!-- Background -->
  <rect width="700" height="350" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="350" y="30" text-anchor="middle" font-size="16" fill="#333" font-weight="600">Payment Fees: Traditional vs Bitcoin Cash</text>
  
  <!-- Chart area -->
  <line x1="100" y1="300" x2="650" y2="300" stroke="#e0e0e0" stroke-width="2"/>
  <line x1="100" y1="60" x2="100" y2="300" stroke="#e0e0e0" stroke-width="2"/>
  
  <!-- Y-axis labels -->
  <text x="90" y="305" text-anchor="end" font-size="12" fill="#666">$0</text>
  <text x="90" y="245" text-anchor="end" font-size="12" fill="#666">$1</text>
  <text x="90" y="185" text-anchor="end" font-size="12" fill="#666">$2</text>
  <text x="90" y="125" text-anchor="end" font-size="12" fill="#666">$3</text>
  <text x="90" y="65" text-anchor="end" font-size="12" fill="#666">$4</text>
  
  <!-- Grid lines -->
  <line x1="100" y1="240" x2="650" y2="240" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="100" y1="180" x2="650" y2="180" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="100" y1="120" x2="650" y2="120" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="100" y1="60" x2="650" y2="60" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="4,4"/>
  
  <!-- Bar 1: Credit Card (3% of $50 = $1.50) -->
  <rect x="150" y="210" width="60" height="90" fill="#ef5350" opacity="0.8"/>
  <text x="180" y="200" text-anchor="middle" font-size="13" fill="#333" font-weight="600">$1.50</text>
  <text x="180" y="320" text-anchor="middle" font-size="11" fill="#666">Credit Card</text>
  <text x="180" y="335" text-anchor="middle" font-size="10" fill="#999">3% fee</text>
  
  <!-- Bar 2: PayPal (2.9% + $0.30 = $1.75) -->
  <rect x="270" y="195" width="60" height="105" fill="#ff7043" opacity="0.8"/>
  <text x="300" y="185" text-anchor="middle" font-size="13" fill="#333" font-weight="600">$1.75</text>
  <text x="300" y="320" text-anchor="middle" font-size="11" fill="#666">PayPal</text>
  <text x="300" y="335" text-anchor="middle" font-size="10" fill="#999">2.9% + $0.30</text>
  
  <!-- Bar 3: Western Union (5-10% = $2.50-$5) -->
  <rect x="390" y="150" width="60" height="150" fill="#ffa726" opacity="0.8"/>
  <text x="420" y="140" text-anchor="middle" font-size="13" fill="#333" font-weight="600">$5.00</text>
  <text x="420" y="320" text-anchor="middle" font-size="11" fill="#666">Western Union</text>
  <text x="420" y="335" text-anchor="middle" font-size="10" fill="#999">10% fee</text>
  
  <!-- Bar 4: Bank Wire ($25-50) -->
  <rect x="510" y="60" width="60" height="240" fill="#ab47bc" opacity="0.8"/>
  <text x="540" y="50" text-anchor="middle" font-size="13" fill="#333" font-weight="600">$35.00</text>
  <text x="540" y="320" text-anchor="middle" font-size="11" fill="#666">Bank Wire</text>
  <text x="540" y="335" text-anchor="middle" font-size="10" fill="#999">flat fee</text>
  
  <!-- Bar 5: Bitcoin Cash ($0.01) -->
  <rect x="630" y="299.4" width="60" height="0.6" fill="#0AC18E"/>
  <text x="660" y="290" text-anchor="middle" font-size="13" fill="#333" font-weight="600">$0.01</text>
  <text x="660" y="320" text-anchor="middle" font-size="11" fill="#666">Bitcoin Cash</text>
  <text x="660" y="335" text-anchor="middle" font-size="10" fill="#999">flat fee</text>
  
  <!-- Annotation -->
  <text x="350" y="350" text-anchor="middle" font-size="11" fill="#999">For a $50 payment • BCH fees stay the same regardless of amount</text>
</svg>
