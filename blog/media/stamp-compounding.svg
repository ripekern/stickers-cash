<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" style="font-family: system-ui, -apple-system, sans-serif; max-width: 100%; height: auto;">
  <!-- Background -->
  <rect width="800" height="400" fill="#f8f9fa" rx="8"/>
  
  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-size="20" font-weight="600" fill="#2c3e50">How 2% Success Compounds</text>
  
  <!-- Generation labels -->
  <text x="100" y="80" text-anchor="middle" font-size="14" fill="#7f8c8d">Generation 1</text>
  <text x="300" y="80" text-anchor="middle" font-size="14" fill="#7f8c8d">Generation 2</text>
  <text x="500" y="80" text-anchor="middle" font-size="14" fill="#7f8c8d">Generation 3</text>
  <text x="700" y="80" text-anchor="middle" font-size="14" fill="#7f8c8d">Generation 4</text>
  
  <!-- Gen 1: 100 stamps given out -->
  <circle cx="100" cy="150" r="45" fill="#3498db" opacity="0.3"/>
  <text x="100" y="145" text-anchor="middle" font-size="32" font-weight="600" fill="#2c3e50">100</text>
  <text x="100" y="170" text-anchor="middle" font-size="13" fill="#7f8c8d">stamps given</text>
  
  <!-- Arrow 1 -->
  <line x1="155" y1="150" x2="245" y2="150" stroke="#95a5a6" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="200" y="135" text-anchor="middle" font-size="12" fill="#7f8c8d">2%</text>
  
  <!-- Gen 2: 2 people redeem -->
  <circle cx="300" cy="150" r="25" fill="#27ae60" opacity="0.4"/>
  <text x="300" y="155" text-anchor="middle" font-size="20" font-weight="600" fill="#2c3e50">2</text>
  <text x="300" y="185" text-anchor="middle" font-size="12" fill="#27ae60">redeem</text>
  
  <!-- Those 2 give stamps too (split into two smaller circles) -->
  <circle cx="280" cy="240" r="20" fill="#e74c3c" opacity="0.3"/>
  <text x="280" y="245" text-anchor="middle" font-size="16" font-weight="600" fill="#2c3e50">1</text>
  <text x="280" y="268" text-anchor="middle" font-size="10" fill="#7f8c8d">gives 100</text>
  
  <circle cx="320" cy="240" r="20" fill="#e74c3c" opacity="0.3"/>
  <text x="320" y="245" text-anchor="middle" font-size="16" font-weight="600" fill="#2c3e50">1</text>
  <text x="320" y="268" text-anchor="middle" font-size="10" fill="#7f8c8d">gives 100</text>
  
  <!-- Arrow 2 -->
  <line x1="345" y1="150" x2="445" y2="150" stroke="#95a5a6" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="395" y="135" text-anchor="middle" font-size="12" fill="#7f8c8d">2% each</text>
  
  <!-- Gen 3: 4 people redeem (2 from each person) -->
  <circle cx="500" cy="150" r="30" fill="#27ae60" opacity="0.4"/>
  <text x="500" y="155" text-anchor="middle" font-size="24" font-weight="600" fill="#2c3e50">4</text>
  <text x="500" y="188" text-anchor="middle" font-size="12" fill="#27ae60">redeem</text>
  
  <!-- Those 4 give stamps (shown as smaller circles below) -->
  <circle cx="460" cy="240" r="18" fill="#e74c3c" opacity="0.3"/>
  <text x="460" y="244" text-anchor="middle" font-size="14" font-weight="600" fill="#2c3e50">1</text>
  
  <circle cx="490" cy="240" r="18" fill="#e74c3c" opacity="0.3"/>
  <text x="490" y="244" text-anchor="middle" font-size="14" font-weight="600" fill="#2c3e50">1</text>
  
  <circle cx="520" cy="240" r="18" fill="#e74c3c" opacity="0.3"/>
  <text x="520" y="244" text-anchor="middle" font-size="14" font-weight="600" fill="#2c3e50">1</text>
  
  <circle cx="550" cy="240" r="18" fill="#e74c3c" opacity="0.3"/>
  <text x="550" y="244" text-anchor="middle" font-size="14" font-weight="600" fill="#2c3e50">1</text>
  
  <text x="505" y="275" text-anchor="middle" font-size="10" fill="#7f8c8d">each gives 100 stamps</text>
  
  <!-- Arrow 3 -->
  <line x1="540" y1="150" x2="650" y2="150" stroke="#95a5a6" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="595" y="135" text-anchor="middle" font-size="12" fill="#7f8c8d">2% each</text>
  
  <!-- Gen 4: 8 people redeem -->
  <circle cx="700" cy="150" r="35" fill="#27ae60" opacity="0.4"/>
  <text x="700" y="155" text-anchor="middle" font-size="28" font-weight="600" fill="#2c3e50">8</text>
  <text x="700" y="192" text-anchor="middle" font-size="12" fill="#27ae60">redeem</text>
  
  <!-- Summary box -->
  <rect x="50" y="320" width="700" height="60" fill="#fff" stroke="#bdc3c7" stroke-width="1" rx="6"/>
  <text x="400" y="345" text-anchor="middle" font-size="14" fill="#2c3e50">
    <tspan font-weight="600" fill="#27ae60">Exponential growth:</tspan>
    <tspan> 100 → 2 → 4 → 8 → 16 → 32 → 64 → 128 → 256 → 512 → 1,024</tspan>
  </text>
  <text x="400" y="368" text-anchor="middle" font-size="12" fill="#7f8c8d">Just 10 generations from 2% success reaches over 1,000 people</text>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#95a5a6"/>
    </marker>
  </defs>
</svg>
