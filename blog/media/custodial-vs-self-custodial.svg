<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" style="max-width:100%;height:auto;font-family:system-ui,-apple-system,sans-serif;">
  <!-- Background -->
  <rect width="800" height="400" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-size="16" fill="#333" font-weight="600">Custodial vs Self-Custodial: Who Controls the Keys?</text>
  
  <!-- LEFT SIDE: Custodial -->
  <rect x="40" y="60" width="340" height="320" fill="#fff" stroke="#ddd" stroke-width="2" rx="8"/>
  <text x="210" y="90" text-anchor="middle" font-size="18" fill="#333" font-weight="600">Custodial App</text>
  <text x="210" y="110" text-anchor="middle" font-size="12" fill="#999">(Bank, PayPal, Cash App)</text>
  
  <!-- User icon -->
  <circle cx="120" cy="160" r="25" fill="#e0e0e0"/>
  <text x="120" y="168" text-anchor="middle" font-size="20" fill="#666">👤</text>
  <text x="120" y="205" text-anchor="middle" font-size="12" fill="#666">You</text>
  
  <!-- Arrow to middleman -->
  <line x1="150" y1="160" x2="220" y2="160" stroke="#999" stroke-width="2" marker-end="url(#arrowGray)"/>
  <text x="185" y="150" text-anchor="middle" font-size="10" fill="#999">requests</text>
  
  <!-- Middleman (company) -->
  <rect x="230" y="135" width="120" height="50" fill="#f0f0f0" stroke="#ccc" stroke-width="2" rx="6"/>
  <text x="290" y="155" text-anchor="middle" font-size="11" fill="#666">Company holds</text>
  <text x="290" y="170" text-anchor="middle" font-size="11" fill="#666">your money</text>
  
  <!-- Ledger icon -->
  <rect x="250" y="210" width="80" height="60" fill="#ffebee" stroke="#e57373" stroke-width="2" rx="4"/>
  <text x="290" y="235" text-anchor="middle" font-size="11" fill="#e57373">Their</text>
  <text x="290" y="250" text-anchor="middle" font-size="11" fill="#e57373">Ledger</text>
  
  <!-- Arrow from middleman to ledger -->
  <line x1="290" y1="185" x2="290" y2="210" stroke="#999" stroke-width="2" marker-end="url(#arrowGray)"/>
  
  <!-- Risks -->
  <text x="210" y="300" text-anchor="middle" font-size="11" fill="#e57373">⚠️ They can freeze it</text>
  <text x="210" y="320" text-anchor="middle" font-size="11" fill="#e57373">⚠️ They can reverse payments</text>
  <text x="210" y="340" text-anchor="middle" font-size="11" fill="#e57373">⚠️ They can close your account</text>
  <text x="210" y="360" text-anchor="middle" font-size="11" fill="#e57373">⚠️ You hold an IOU, not money</text>
  
  <!-- RIGHT SIDE: Self-Custodial -->
  <rect x="420" y="60" width="340" height="320" fill="#fff" stroke="#0AC18E" stroke-width="2" rx="8"/>
  <text x="590" y="90" text-anchor="middle" font-size="18" fill="#333" font-weight="600">Self-Custodial Wallet</text>
  <text x="590" y="110" text-anchor="middle" font-size="12" fill="#999">(BCH wallet you control)</text>
  
  <!-- User icon with key -->
  <circle cx="510" cy="160" r="25" fill="#e8f5e9"/>
  <text x="510" y="168" text-anchor="middle" font-size="20" fill="#0AC18E">👤</text>
  <text x="510" y="205" text-anchor="middle" font-size="12" fill="#666">You</text>
  
  <!-- Key icon -->
  <circle cx="590" cy="160" r="20" fill="#0AC18E"/>
  <text x="590" y="168" text-anchor="middle" font-size="18" fill="#fff">🔑</text>
  <text x="590" y="205" text-anchor="middle" font-size="12" fill="#666">Your keys</text>
  
  <!-- Arrow from user to key -->
  <line x1="540" y1="160" x2="570" y2="160" stroke="#0AC18E" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="555" y="150" text-anchor="middle" font-size="10" fill="#0AC18E">signs</text>
  
  <!-- Blockchain ledger -->
  <rect x="530" y="230" width="120" height="50" fill="#e8f5e9" stroke="#0AC18E" stroke-width="2" rx="4"/>
  <text x="590" y="250" text-anchor="middle" font-size="11" fill="#0AC18E">Public</text>
  <text x="590" y="265" text-anchor="middle" font-size="11" fill="#0AC18E">Blockchain</text>
  
  <!-- Arrow from key to blockchain -->
  <line x1="590" y1="180" x2="590" y2="230" stroke="#0AC18E" stroke-width="2" marker-end="url(#arrowGreen)"/>
  
  <!-- Benefits -->
  <text x="590" y="300" text-anchor="middle" font-size="11" fill="#0AC18E">✓ You control it completely</text>
  <text x="590" y="320" text-anchor="middle" font-size="11" fill="#0AC18E">✓ Payments are final</text>
  <text x="590" y="340" text-anchor="middle" font-size="11" fill="#0AC18E">✓ No one can freeze or close it</text>
  <text x="590" y="360" text-anchor="middle" font-size="11" fill="#0AC18E">✓ You hold the actual money</text>
  
  <!-- Arrow definitions -->
  <defs>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#999"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#0AC18E"/>
    </marker>
  </defs>
</svg>
